name: C++ App Release

on:
  push:
    branches: [master]
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  release:
    if: ${{ !github.event.deleted }}
    uses: COMPANY_ORG/.github/.github/workflows/cpp-release.yml@main
    with:
      # 应用发布：发布根目录和默认产物目录由 runner 配置。
      deploy-target: app
    secrets:
      CI_SSH_KEY: ${{ secrets.CI_SSH_KEY }}
