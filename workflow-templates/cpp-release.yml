name: C++ Tag and Release

on:
  push:
    branches: [master]
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    if: ${{ !github.event.deleted }}
    uses: COMPANY_ORG/.github/.github/workflows/cpp-release.yml@main
    secrets:
      CI_SSH_KEY: ${{ secrets.CI_SSH_KEY }}
