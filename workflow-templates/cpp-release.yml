name: C++ Tag and Release

on:
  push:
    branches: [master]
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  release:
    if: ${{ !github.event.deleted }}
    uses: COMPANY_ORG/.github/.github/workflows/cpp-release.yml@main
    with:
      # 选择 app（应用）、strategy（策略）或 none（仅构建测试和打 tag，不复制产物）。
      deploy-target: none
    secrets:
      CI_SSH_KEY: ${{ secrets.CI_SSH_KEY }}
