name: Build and test
description: Prepare the project, build it and run tests using the company toolchain

inputs:
  build-type:
    description: CMake build type
    required: false
    default: "Release"

  coverage:
    description: Enable coverage instrumentation and always run tests
    required: false
    default: "false"

  run-tests:
    description: Run unit tests after building
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Prepare
      shell: bash
      env:
        CI_ACTION_PATH: ${{ github.action_path }}
      run: bash "$CI_ACTION_PATH/../shared/run-container.sh" build-test/prepare.sh

    - name: Build
      shell: bash
      env:
        CI_ACTION_PATH: ${{ github.action_path }}
        BUILD_TYPE: ${{ inputs.build-type }}
        COVERAGE: ${{ inputs.coverage }}
      run: bash "$CI_ACTION_PATH/../shared/run-container.sh" build-test/build.sh

    - name: Test
      if: ${{ inputs.run-tests == 'true' || inputs.coverage == 'true' }}
      shell: bash
      env:
        CI_ACTION_PATH: ${{ github.action_path }}
      run: bash "$CI_ACTION_PATH/../shared/run-container.sh" build-test/test.sh
