name: Run C++ CI phase
description: Run one C++ CI phase using the company toolchains

inputs:
  phase:
    description: CI phase to run (prepare, build, test, coverage, tag, package)
    required: true

  build-type:
    description: CMake build type
    required: false
    default: "Release"

  coverage:
    description: Enable coverage instrumentation during build
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run build container
      shell: bash
      env:
        PHASE: ${{inputs.phase}}
        BUILD_TYPE: ${{ inputs.build-type }}
        CI_ACTION_PATH: ${{ github.action_path }}
        COVERAGE: ${{ inputs.coverage }}
      run: bash "$CI_ACTION_PATH/run.sh"