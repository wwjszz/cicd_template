name: Reusable C++ CI

on:
    workflow_call:
        inputs:
            runner-label:
                description: Custom label of the runner
                required: true
                type: string
            
            build-image:
                description: Docker image used for building
                required: true
                type: string
            
            build-command:
                description: Command executed inside 
                required: true
                type: string
            

permissions:
    contents: read

jobs:
    build:
        name: Build and test
        runs-on: [self-hosted, linux, x64, "${{ inputs.runner-label }}"]
        timeout-minutes: 30

        steps:
            - name: Diagnose GitHub HTTPS
              shell: bash
              timeout-minutes: 2
              working-directory: ${{ runner.temp }}
              env:
                  GIT_TERMINAL_PROMPT: "0"
              run: |
                  set +e

                  timeout 30s git ls-remote https://github.com/actions/checkout.git HEAD
                  echo "Default HTTPS exit code: $?"

                  timeout 30s git -c http.version=HTTP/1.1 ls-remote https://github.com/actions/checkout.git HEAD
                  echo "HTTP/1.1 exit code: $?"

            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run build command
              shell: bash
              env:
                  BUILD_IMAGE: ${{ inputs.build-image }}
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: |
                  docker run --rm --init \
                      --cpus 2 \
                      --memory 4g \
                      --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE" \
                      --workdir "$GITHUB_WORKSPACE" \
                      --env TZ=Asia/Shanghai \
                      --entrypoint /bin/bash \
                      "$BUILD_IMAGE" \
                      -e -o pipefail -c "$BUILD_COMMAND"