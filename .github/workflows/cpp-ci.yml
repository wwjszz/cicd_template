name: Reusable C++ CI

on:
    workflow_call:
        inputs:
            runner-label:
                description: Custom label of the runner
                required: true
                type: string
            
            build-image:
                description: Docker image used for building
                required: true
                type: string
            
            build-command:
                description: Command executed inside 
                required: true
                type: string
            

permissions:
    contents: read

jobs:
    build:
        name: Build and test
        runs-on: [self-hosted, linux, x64, "${{ inputs.runner-label }}"]
        timeout-minutes: 30

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false