name: Reusable C++ CI

on:
    workflow_call:
        inputs:
            runner-label:
                description: Custom label of the runner
                required: true
                type: string

            build-type:
                description: CMake build type
                required: false
                type: string
                default: Release

            run-tests:
                description: Run unit tests after building
                required: false
                type: boolean
                default: true

            coverage:
                description: Generate coverage reports
                required: false
                type: boolean
                default: false

        secrets:
            CI_SSH_KEY:
                description: SSH private key for checking out source
                required: true

permissions:
    contents: read

jobs:
    build:
        name: C++ CI
        runs-on: [self-hosted, linux, x64, "${{ inputs.runner-label }}"]
        timeout-minutes: 30

        steps:
            - name: Setup
              uses: $/actions/setup
              with:
                ssh-key: ${{ secrets.CI_SSH_KEY }}

            - name: ${{ (inputs.run-tests || inputs.coverage) && 'Build and test' || 'Build' }}
              uses: $/actions/build-test
              with:
                build-type: ${{ inputs.build-type }}
                run-tests: ${{ inputs.run-tests }}
                coverage: ${{ inputs.coverage }}

            - name: Coverage
              if: ${{ inputs.coverage }}
              uses: $/actions
              with:
                phase: coverage

            - name: Upload coverage report
              if: ${{ inputs.coverage }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: coverage-report
                  path: build/test_coverage/
                  if-no-files-found: error
