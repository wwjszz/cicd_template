name: C++ Build and Test

on:
  workflow_call:
    secrets:
      CI_SSH_KEY:
        description: SSH private key for source and private build dependencies
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Release build and test
    runs-on: [self-hosted, linux, x64, cpp-cicd-runner]
    timeout-minutes: 30

    steps:
      - name: Setup
        uses: $/actions/setup
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Build and test
        uses: $/actions/build-test
        with:
          build-type: Release
