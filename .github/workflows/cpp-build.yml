name: C++ Lab Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Release build and test
    runs-on: [self-hosted, linux, x64, wt-cicd-lab]
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Prepare
        uses: $/.github/actions
        with:
          phase: prepare

      - name: Build Release
        uses: $/.github/actions
        with:
          phase: build
          build-type: Release
          coverage: "false"

      - name: Test
        uses: $/.github/actions
        with:
          phase: test
          build-type: Release
          coverage: "false"
