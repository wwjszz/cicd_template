name: C++ Tag and Release

on:
  workflow_call:
    inputs:
      deploy-target:
        description: app, strategy or none
        type: string
        default: none

      release-name:
        description: Application or strategy name; default to repository name
        type: string
        default: ""

      publish-dir:
        description: Optional project-relative directory; empty uses the runner default
        type: string
        default: ""

    secrets:
      CI_SSH_KEY:
        description: SSH private key for source and private build dependencies
        required: true

permissions:
  contents: read

jobs:
  tag:
    name: Generate version tag
    runs-on: [self-hosted, linux, x64, cpp-cicd-runner]
    timeout-minutes: 30

    concurrency:
      group: auto-version-tag
      cancel-in-progress: false
      queue: max

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Setup
        uses: $/actions/setup
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}
          ref: ${{ github.sha }}

      - name: Build and test Release
        uses: $/actions/build-test
        with:
          build-type: Release

      - name: Generate and push version tag
        uses: $/actions
        with:
          phase: tag

      - name: Export version tag
        id: version
        shell: bash
        run: |
          tag="$(cat artifacts/release-tag.txt)"
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  release:
    name: RelWithDebInfo build and publish
    needs: tag
    runs-on: [self-hosted, linux, x64, cpp-cicd-runner]
    timeout-minutes: 30

    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Setup
        uses: $/actions/setup
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}
          ref: refs/tags/${{ needs.tag.outputs.tag}}

      - name: Verify release source
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Release tag does not match the triggering commit." >&2
            exit 1
          fi

      - name: Build and test RelWithDebInfo
        uses: $/actions/build-test
        with:
          build-type: RelWithDebInfo

      - name: Publish to server
        if: ${{ inputs.deploy-target != 'none' }}
        uses: $/actions/publish
        with:
          deploy-target: ${{ inputs.deploy-target }}
          release-name: ${{ inputs.release-name || github.event.repository.name }}
          publish-dir: ${{ inputs.publish-dir }}
          release-tag: ${{ needs.tag.outputs.tag }}
