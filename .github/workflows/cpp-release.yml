name: C++ Lab Tag and Artifact

on:
  workflow_call:
    secrets:
      CI_SSH_KEY:
        description: SSH private key with read access and permission to push tags
        required: true

permissions:
  contents: read

jobs:
  tag:
    name: Build, test and generate version tag
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && !github.event.deleted }}
    runs-on:
      group: lab-runners
      labels: [self-hosted, linux, x64, wt-cicd-lab]
    timeout-minutes: 15

    concurrency:
      group: auto-version-tag
      cancel-in-progress: false
      queue: max

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          # Keep checkout SSH authentication until this job finishes so tag push can use it.
          persist-credentials: true
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Prepare
        uses: $/.github/actions
        with:
          phase: prepare

      - name: Build Release
        uses: $/.github/actions
        with:
          phase: build
          build-type: Release
          coverage: "false"

      - name: Test
        uses: $/.github/actions
        with:
          phase: test

      - name: Generate and push version tag
        uses: $/.github/actions
        with:
          phase: tag

      - name: Export version tag
        id: version
        shell: bash
        run: |
          tag="$(cat artifacts/release-tag.txt)"
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  release:
    name: RelWithDebInfo build and artifact
    needs: tag
    runs-on:
      group: lab-runners
      labels: [self-hosted, linux, x64, wt-cicd-lab]
    timeout-minutes: 15

    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Checkout tagged source
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Verify release source
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Release tag does not match the triggering commit." >&2
            exit 1
          fi

      - name: Prepare
        uses: $/.github/actions
        with:
          phase: prepare

      - name: Compile RelWithDebInfo
        uses: $/.github/actions
        with:
          phase: build
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Test release build
        uses: $/.github/actions
        with:
          phase: test
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Package
        uses: $/.github/actions
        with:
          phase: package
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Persist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ needs.tag.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/build-output.tar.gz
            artifacts/build-info.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
