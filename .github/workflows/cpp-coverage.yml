name: C++ Coverage

on:
  workflow_call:
    secrets:
      CI_SSH_KEY:
        description: SSH private key for source and private build dependencies
        required: true

permissions:
  contents: read

jobs:
  coverage:
    name: Debug build, test and coverage
    runs-on: [self-hosted, linux, x64, wwj-cicd]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CI_SSH_KEY }}
          ssh-auth-sock: ${{ runner.temp }}/ssh-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.sock
          log-public-key: false

      - name: Build and test with coverage instrumentation
        uses: $/.github/actions/build-test
        with:
          build-type: Debug
          coverage: "true"

      - name: Generate coverage report
        uses: $/.github/actions
        with:
          phase: coverage
          build-type: Debug
          coverage: "true"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: build/test_coverage/
          if-no-files-found: error
