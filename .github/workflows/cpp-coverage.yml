name: C++ Coverage

on:
  workflow_call:
    secrets:
      CI_SSH_KEY:
        description: SSH private key for source and private build dependencies
        required: true

permissions:
  contents: read

jobs:
  coverage:
    name: Debug build, test and coverage
    runs-on: [self-hosted, linux, x64, cpp-cicd-runner]
    timeout-minutes: 30

    steps:
      - name: Setup
        uses: $/actions/setup
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Build and test with coverage instrumentation
        uses: $/actions/build-test
        with:
          build-type: Debug
          coverage: "true"

      - name: Generate coverage report
        uses: $/actions/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: build/test_coverage/
          if-no-files-found: warn
          # artifact 过期时间（天）
          retention-days: 30
