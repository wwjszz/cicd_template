name: Setup source and SSH
description: Check out source and start the SSH agent for private dependencies

inputs:
  ssh-key:
    description: SSH private key for source and private build dependencies
    required: true
  ref:
    description: Branch, tag or commit to check out; empty uses the triggering event
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
        ssh-key: ${{ inputs.ssh-key }}

    - name: Start SSH agent
      uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-key }}
        ssh-auth-sock: ${{ runner.temp }}/ssh-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.sock
        log-public-key: false
